<title>Critter Cove Rescue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d3440;--bg2:#08232b;--card:#fffaf2;--card2:#fff3e2;--ink:#132530;--ink2:#3b4f59;--muted:#6a7b84;--line:#eadfcd;--line2:#d9cbb4;
  --teal:#0f8b8d;--teal-d:#0a6567;--teal-l:#d9f2ef;--coral:#ff6b57;--coral-d:#d9483a;--coral-l:#ffe4de;
  --gold:#ffc53d;--gold-d:#d9a012;--gold-l:#fff2cc;--mint:#27b884;--mint-d:#1b8f66;--mint-l:#dbf5e9;--sky:#e4f4fa;
  --disp:"Bricolage Grotesque","Lexend",system-ui,sans-serif;--emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:radial-gradient(1100px 560px at 85% -8%,#1d6674 0,transparent 62%),radial-gradient(700px 400px at -10% 30%,#12505c 0,transparent 60%),linear-gradient(180deg,var(--bg),var(--bg2));background-attachment:fixed;color:var(--ink);font-family:"Lexend",system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
[hidden]{display:none!important}
#app{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:14px 44px}
.px{font-family:var(--disp)}
.box{background:var(--card);border-radius:24px;box-shadow:0 14px 36px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.9)}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn{font-family:var(--disp);font-weight:700;font-size:20px;padding:10px 24px;min-height:56px;border:0;border-radius:16px;background:linear-gradient(180deg,#ff8a6f,#ff5d47);color:#fff;box-shadow:0 5px 0 var(--coral-d),0 10px 20px rgba(217,72,58,.3);display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:transform .06s,box-shadow .06s;text-shadow:0 1px 0 rgba(0,0,0,.12)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--coral-d),0 4px 10px rgba(217,72,58,.25)}
.btn.teal{background:linear-gradient(180deg,#19a6a8,#0f8b8d);box-shadow:0 5px 0 var(--teal-d),0 10px 20px rgba(10,101,103,.3)}
.btn.teal:active{box-shadow:0 1px 0 var(--teal-d)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line2),0 8px 16px rgba(0,0,0,.08);text-shadow:none}
.btn.ghost:active{box-shadow:0 1px 0 var(--line2)}
.btn.sm{font-size:16px;min-height:46px;padding:6px 16px;border-radius:13px}
.btn[disabled]{opacity:.5;pointer-events:none}
.linkbtn{background:none;border:0;color:var(--teal-d);text-decoration:underline;text-underline-offset:3px;font-size:15px;padding:8px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.center{justify-content:center}
.muted{color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:var(--teal-l);color:var(--teal-d);padding:4px 10px;border-radius:999px}
.tag.soft{background:var(--gold-l);color:#7a5a00}
.ic{width:24px;height:24px;display:inline-block;vertical-align:-5px;flex:none}
.li{width:24px;height:24px;display:inline-block;vertical-align:middle}
h1,h2,h3{text-wrap:balance;margin:0}

/* critter art */
.kw{display:inline-block;overflow:visible;filter:drop-shadow(0 6px 5px rgba(0,0,0,.18))}
.crit.xs{font-size:28px}.crit.sm{font-size:40px}.crit.md{font-size:54px}.crit.lg{font-size:86px}.crit.xl{font-size:128px}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.jump{animation:jump .55s ease-out}
@keyframes jump{30%{transform:translateY(-22px) rotate(-8deg) scale(1.08)}60%{transform:translateY(0)}80%{transform:translateY(-6px)}}
.medal{position:relative;width:176px;height:176px;flex:none;display:grid;place-items:center}
.medal svg.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.medal .disc{width:136px;height:136px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 -8px 16px rgba(0,0,0,.12),inset 0 6px 12px rgba(255,255,255,.7)}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;color:#fff}
.logo{font-family:var(--disp);font-size:28px;font-weight:800;display:flex;align-items:center;gap:10px;letter-spacing:-.01em}
.logo .mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--gold),#ff8a4a);display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.logo .mark .ic{width:26px;height:26px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#fff;padding:6px 14px;border-radius:999px;font-weight:600;font-size:18px;min-height:44px;font-variant-numeric:tabular-nums;backdrop-filter:blur(6px)}
.qwrap .chip{background:#fff;color:var(--ink);border-color:var(--line)}
.btnchip:active{transform:translateY(1px)}
.gate{position:relative;overflow:hidden;font-size:14px}
.gate span{position:relative}
.gate .gfill{position:absolute;inset:0;background:rgba(255,197,61,.8);transform-origin:left;transform:scaleX(0)}
.gate.holding .gfill{transform:scaleX(1);transition:transform 1.2s linear}

/* home */
.home{display:grid;grid-template-columns:1fr 1.25fr;gap:22px}
.home>.cove{grid-column:1/-1}
@media (max-width:800px){.home{grid-template-columns:1fr}}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px}
.card-h h2{font-family:var(--disp);font-size:23px;font-weight:700;letter-spacing:-.01em}
.rescue{padding:22px;display:flex;flex-direction:column;gap:14px}
.kennel{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.cname{font-family:var(--disp);font-size:26px;font-weight:800;line-height:1.1;letter-spacing:-.01em}
.bignum{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--coral)}
.fact{font-size:15px;background:var(--sky);border-radius:14px;padding:10px 14px;color:var(--ink2)}
.meter{height:28px;border-radius:999px;background:#efe6d6;position:relative;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.12)}
.meter>i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:linear-gradient(180deg,#ff8a6f,#ff5d47);box-shadow:inset 0 3px 0 rgba(255,255,255,.35)}
.meter>span{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.mission{padding:22px}
.stations{display:grid;gap:10px}
.station{display:grid;grid-template-columns:54px 1fr auto;align-items:center;gap:14px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:18px;padding:10px 14px;min-height:76px;box-shadow:0 4px 0 var(--line);transition:transform .06s}
.station:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.station .ico{width:54px;height:54px;display:grid;place-items:center;border-radius:15px;background:var(--teal-l)}
.station .ico .ic{width:30px;height:30px}
.station b{font-size:18px;display:block;font-weight:600}
.station small{color:var(--muted);font-size:14px}
.station .st{font-size:13px;font-weight:600;padding:4px 12px;border-radius:999px;background:#f1eadf;color:var(--ink2);white-space:nowrap}
.station.done{background:var(--mint-l);border-color:#a8e3c9;box-shadow:0 4px 0 #a8e3c9}
.station.done .st{background:var(--mint);color:#fff}
.station.next{background:var(--gold-l);border-color:#f3d37a;box-shadow:0 4px 0 #f3d37a}
.station.next .st{background:var(--gold);color:#4a3600}
.mfoot{margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.intro{margin:0 0 14px;color:var(--ink2)}

/* cove */
.cove{padding:0;overflow:hidden}
.cove .card-h{padding:18px 22px 4px}
.scene{position:relative;height:280px;overflow:hidden;border-radius:0 0 24px 24px}
.scene svg.land{position:absolute;inset:0;width:100%;height:100%}
.waves{animation:waves 6s linear infinite}
@keyframes waves{to{transform:translateX(-120px)}}
.cloudg{animation:drift 70s linear infinite}
@keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(1100px)}}
.cv-critter{position:absolute;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;animation:wander 12s ease-in-out infinite}
@keyframes wander{0%,100%{transform:translateX(0)}50%{transform:translateX(var(--dx))}}
.cv-critter .kw{animation:bob 2.2s ease-in-out infinite}
.cv-name{font-size:12px;font-weight:600;background:rgba(255,255,255,.92);padding:2px 9px;border-radius:999px;margin-top:2px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.scene-empty{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);background:rgba(255,255,255,.92);border-radius:14px;padding:8px 14px;font-size:15px;margin:0;text-align:center;width:max-content;max-width:86%}
.floatheart{position:absolute;pointer-events:none;animation:floatup 1s ease-out forwards;z-index:5}
@keyframes floatup{from{transform:translateY(0) scale(.8);opacity:1}to{transform:translateY(-60px) scale(1.2);opacity:0}}

/* question */
.qwrap{display:flex;flex-direction:column;gap:16px;position:relative}
.qbar{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;color:#fff}
.qbar .qt{font-family:var(--disp);font-size:21px;font-weight:700}
.qprog{height:12px;border-radius:999px;background:rgba(255,255,255,.18);margin-top:6px;overflow:hidden}
.qprog i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold),#ff9b52)}
.iconbtn{width:52px;height:52px;border:0;border-radius:15px;background:#fff;color:var(--ink);display:grid;place-items:center;box-shadow:0 4px 0 var(--line2);padding:0}
.qbar .iconbtn{background:rgba(255,255,255,.14);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.25)}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line2)}
.qcard{padding:26px;display:flex;flex-direction:column;gap:18px;min-height:440px}
.qtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qtop .iconbtn{margin-left:auto;background:var(--teal-l);color:var(--teal-d);box-shadow:0 4px 0 #b4e0da}
.prompt{font-size:24px;font-weight:500;line-height:1.45;max-width:34em}
.prompt.big{font-size:54px;font-weight:600;font-variant-numeric:tabular-nums lining-nums;text-align:center;max-width:none;letter-spacing:.01em;color:var(--ink)}
.sub{font-size:22px;background:var(--sky);border-radius:16px;padding:12px 16px}
.blank{display:inline-block;min-width:4em;border-bottom:3px solid var(--ink);color:transparent}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;font-size:.8em;margin:0 .12em;font-variant-numeric:tabular-nums lining-nums}
.fr>span:first-child{border-bottom:.08em solid currentColor;padding:0 .2em .04em}
.fr>span:last-child{padding-top:.04em}
.mx{margin-right:.08em}
.fig{display:block;max-width:100%;width:340px;height:auto;margin:0 auto}
.fig text{font:600 15px "Lexend",sans-serif;fill:#132530}
.ans{display:flex;flex-direction:column;align-items:center;gap:16px}
.numrow{display:flex;align-items:center;gap:10px}
.numdisp{min-width:200px;height:74px;border-radius:18px;border:3px solid var(--line);background:#fff;font-size:42px;font-weight:600;display:grid;place-items:center;padding:0 16px;font-variant-numeric:tabular-nums lining-nums;box-shadow:inset 0 2px 6px rgba(0,0,0,.06)}
.numdisp.empty{color:#c9bfb0}
.unit{font-size:20px;font-weight:600}
.keypad{display:grid;grid-template-columns:repeat(3,84px);gap:10px}
.keypad button{height:64px;border:2px solid var(--line);border-radius:16px;background:#fff;font-size:30px;font-weight:600;font-variant-numeric:lining-nums;box-shadow:0 4px 0 var(--line2)}
.keypad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line2)}
.keypad .chk{grid-column:1/-1;border:0;background:linear-gradient(180deg,#34cf96,#23a877);color:#fff;font-family:var(--disp);font-size:22px;font-weight:700;box-shadow:0 5px 0 var(--mint-d)}
.keypad .blankkey{visibility:hidden}
.fin{display:flex;align-items:center;gap:12px}
.slot{width:80px;height:60px;border:3px solid var(--line);border-radius:14px;background:#fff;font-size:32px;font-weight:600;display:grid;place-items:center;padding:0;font-variant-numeric:lining-nums}
.slot.whole{height:80px}
.slot.on{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-l)}
.stack{display:flex;flex-direction:column;align-items:center;gap:6px}
.stack .bar{width:92px;height:4px;border-radius:2px;background:var(--ink)}
.mini{font-size:13px;color:var(--muted);margin:-6px 0 0}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.choices.one{grid-template-columns:1fr}
.choice{background:#fff;border:2px solid var(--line);border-radius:18px;box-shadow:0 4px 0 var(--line2);padding:14px 18px;min-height:66px;font-size:20px;text-align:left;line-height:1.4}
.choices:not(.one) .choice{text-align:center;font-size:28px;font-weight:600;font-variant-numeric:lining-nums}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line2)}
.choice.wrong{background:var(--coral-l);border-color:#f5b3a8;text-decoration:line-through;opacity:.75;pointer-events:none}
.choice.right{background:var(--mint-l);border-color:#8fdcbb}
.spelldisp{min-width:280px;min-height:74px;border:3px solid var(--line);border-radius:18px;background:#fff;font-size:38px;letter-spacing:.1em;display:grid;place-items:center;padding:0 18px;font-weight:500}
.kb{display:flex;flex-direction:column;gap:7px;width:100%;max-width:660px}
.kb .kr{display:flex;gap:6px;justify-content:center}
.kb button{flex:1;max-width:58px;height:56px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:23px;font-weight:500;padding:0;box-shadow:0 3px 0 var(--line2)}
.kb button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line2)}
.kb .wide{max-width:120px;flex:2;font-size:17px}
.kb .go{border:0;background:linear-gradient(180deg,#34cf96,#23a877);color:#fff;font-family:var(--disp);font-weight:700;font-size:20px;box-shadow:0 4px 0 var(--mint-d)}
.fb{border-radius:18px;padding:16px 18px;font-size:18px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;border-left:6px solid}
.fb.good{background:var(--mint-l);border-color:var(--mint)}
.fb.warn{background:var(--gold-l);border-color:var(--gold)}
.fb.teach{background:var(--teal-l);border-color:var(--teal)}
.fb.neutral{background:var(--sky);border-color:#7cc3dd}
.fb b{font-size:20px;font-family:var(--disp)}
.fb .plus{font-weight:700;color:var(--coral);display:inline-flex;align-items:center;gap:4px}
.exp{line-height:1.65}
pre.col{font:600 22px/1.35 ui-monospace,Menlo,monospace;background:#fff;border-radius:12px;padding:10px 16px;margin:6px 0}
.fbar{display:flex;gap:3px;margin:8px 0;max-width:320px}
.fbar i{flex:1;height:20px;border-radius:4px;border:2px solid var(--ink2);background:#fff}
.fbar i.on{background:var(--gold)}
mark{background:var(--gold);color:var(--ink);padding:0 2px;border-radius:3px}
.buddy{position:absolute;right:14px;bottom:-4px;pointer-events:none}
@media (max-width:640px){.buddy{display:none}.prompt.big{font-size:40px}.keypad{grid-template-columns:repeat(3,74px)}.qcard{padding:18px}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.timer{height:16px;border-radius:999px;background:#efe6d6;overflow:hidden}
.timer i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold),var(--coral))}
.sprint-score{font-size:22px;text-align:center;font-weight:600;display:flex;gap:8px;justify-content:center;align-items:center}
.numdisp.bad{background:var(--coral-l);border-color:#f5b3a8}
.numdisp.ok{background:var(--mint-l);border-color:#8fdcbb}

/* writing */
.qw{padding:24px;display:flex;flex-direction:column;gap:14px}
.qw-prompt{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.qw-prompt h2{font-size:23px;font-weight:600;flex:1 1 300px;line-height:1.35}
.qw-prompt .iconbtn{background:var(--teal-l);color:var(--teal-d);box-shadow:0 4px 0 #b4e0da}
.goals{display:flex;gap:8px;flex-wrap:wrap}
.goal{border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;background:#fff;display:inline-flex;align-items:center;gap:6px}
.goal::before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid var(--line2)}
.goal.met{background:var(--mint-l);border-color:#8fdcbb}
.goal.met::before{background:var(--mint);border-color:var(--mint)}
.starters{display:flex;gap:8px;flex-wrap:wrap}
.starter{border:2px dashed #9ad3cd;border-radius:12px;background:var(--teal-l);color:var(--teal-d);padding:6px 12px;font-size:16px;min-height:42px}
textarea{width:100%;font:500 21px/1.65 "Lexend",sans-serif;border:3px solid var(--line);border-radius:18px;padding:14px 16px;background:#fff;color:var(--ink);resize:vertical;min-height:210px}
.qw-meta{font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.coach{padding:16px 18px;background:#fff;display:flex;flex-direction:column;gap:6px;border-radius:18px;border:2px solid var(--line);box-shadow:none}
.coach-h{display:flex;gap:12px;align-items:center}
.coach p{margin:0}
.stars{display:flex;gap:4px}
.stars span{opacity:.22}.stars span.on{opacity:1}
.stars .ic{width:26px;height:26px}
.fixes ul{margin:4px 0 0;padding-left:20px}
.fixes li{margin:3px 0}
.fixes s{color:#b3263b}
.loading{display:flex;align-items:center;gap:14px;padding:14px;background:var(--sky);border-radius:16px}

/* summary / rescue */
.center-card{max-width:660px;margin:10px auto;padding:30px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.center-card h1{font-family:var(--disp);font-size:38px;font-weight:800;line-height:1.1;letter-spacing:-.015em}
.bigstats{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.bigstat{border-radius:18px;background:#fff;border:2px solid var(--line);padding:12px 18px;min-width:132px}
.bigstat b{display:block;font-size:32px;font-weight:700;font-variant-numeric:tabular-nums lining-nums}
.bigstat span{font-size:14px;color:var(--muted)}
.ups{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.up{background:var(--gold-l);border:2px solid var(--gold);border-radius:999px;padding:4px 12px;font-weight:600;font-size:15px}
.choose{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:100%}
@media (max-width:640px){.choose{grid-template-columns:1fr}}
.ccard{background:#fff;border:2px solid var(--line);border-radius:22px;box-shadow:0 5px 0 var(--line2);padding:18px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.ccard:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line2)}
.ccard .disc{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 -8px 14px rgba(0,0,0,.1),inset 0 6px 12px rgba(255,255,255,.7)}
.ccard .cname{font-size:20px}
.ccard small{font-size:14px;color:var(--ink2)}
.nameinput{font:600 24px "Lexend",sans-serif;border:3px solid var(--line);border-radius:16px;padding:12px 16px;width:100%;max-width:360px;text-align:center;background:#fff;color:var(--ink)}
.glow{position:relative}
.glow::before{content:"";position:absolute;inset:-30px;border-radius:50%;background:radial-gradient(circle,rgba(255,197,61,.55),transparent 65%);animation:pulse 2s ease-in-out infinite;z-index:-1}
@keyframes pulse{50%{transform:scale(1.12);opacity:.7}}
.pathmap{width:100%;display:grid;gap:6px;text-align:left}
.pathrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:6px 0}
.paws{display:flex;gap:4px}
.paws i{width:18px;height:18px;border-radius:50%;background:#efe6d6}
.paws i.on{background:linear-gradient(180deg,var(--gold),#ff9b52)}
.welcome-parade{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* dashboard */
.dash{display:flex;flex-direction:column;gap:20px}
.dash-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;color:#fff}
.dash-h h1{font-family:var(--disp);font-size:30px;font-weight:800}
.panel{padding:22px}
.panel h2{font-family:var(--disp);font-size:20px;font-weight:700;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{border-radius:16px;background:#fff;border:2px solid var(--line);padding:12px 14px}
.kpi b{display:block;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;margin-top:4px}
.days div{aspect-ratio:1;border-radius:6px;background:#efe6d6;max-width:100%}
.days div.l1{background:#bfe9d4}.days div.l2{background:#6fd1a4}.days div.l3{background:var(--mint)}
.days div.today{outline:3px solid var(--gold);outline-offset:1px}
.dlabels{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.areas{display:grid;gap:10px}
.arow{display:grid;grid-template-columns:90px 1fr 70px;gap:10px;align-items:center;font-variant-numeric:tabular-nums}
.abar{height:14px;border-radius:999px;background:#efe6d6;overflow:hidden}
.abar i{display:block;height:100%;border-radius:999px;background:var(--teal)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:15px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:2px solid var(--line);padding:6px 8px}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
td.std{font-size:12px;color:var(--muted)}
.pips{display:inline-flex;gap:3px;vertical-align:middle;margin-right:6px}
.pips i{width:12px;height:12px;border-radius:50%;background:#efe6d6}
.pips i.on{background:var(--teal)}
.status{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.status.s-good{background:var(--mint-l);color:var(--mint-d)}.status.s-mid{background:var(--gold-l);color:#7a5a00}.status.s-low{background:var(--coral-l);color:#a8342a}
.focus{display:grid;gap:10px}
.focus div{border-left:5px solid var(--coral);background:#fff;padding:10px 14px;border-radius:0 14px 14px 0}
.wchips{display:flex;flex-wrap:wrap;gap:6px}
.wchip{border-radius:999px;background:#fff;border:2px solid var(--line);padding:3px 10px;font-size:15px}
.sample{border-top:1px solid var(--line);padding:12px 0;display:grid;gap:6px}
.sample blockquote{margin:0;padding:10px 14px;background:#fff;border-radius:12px;white-space:pre-wrap;font-size:15px}
.rub{display:flex;gap:8px;flex-wrap:wrap;font-size:13px}
.rub span{border-radius:999px;padding:2px 9px;background:var(--teal-l);color:var(--teal-d)}
.settings{display:grid;gap:12px}
.settings input{font:500 17px "Lexend",sans-serif;border:2px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff;color:var(--ink)}
.note{font-size:14px;color:var(--muted);max-width:72ch}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:16px;font-weight:600;font-size:18px;z-index:70;box-shadow:0 10px 24px rgba(0,0,0,.3);max-width:calc(100% - 32px);text-align:center}
.modal{position:fixed;inset:0;background:rgba(8,35,43,.6);display:grid;place-items:center;z-index:80;padding:16px}
.mbox{padding:24px;max-width:460px;display:flex;flex-direction:column;gap:16px;font-size:19px}
.mbox p{margin:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.qlayout{display:grid;gap:16px;align-items:start}
.qlayout.with-pad{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr)}
@media (max-width:900px){.qlayout.with-pad{grid-template-columns:1fr}}
.qlayout.with-pad .prompt.big{font-size:44px}
.qlayout.with-pad ~ .buddy{display:none}
.pad{padding:14px;display:flex;flex-direction:column;gap:10px;position:sticky;top:calc(10px + env(safe-area-inset-top,0px))}
.padbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.padbar .seg{display:flex;gap:6px;padding:4px;border-radius:14px;background:#f4ede1}
.tool{width:44px;height:44px;border-radius:11px;border:2px solid transparent;background:#fff;display:grid;place-items:center;padding:0}
.tool i{width:20px;height:20px;border-radius:50%;display:block}
.tool.on,.tbtn.on{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-l)}
.tbtn{min-height:44px;padding:0 12px;border-radius:11px;border:2px solid transparent;background:#fff;font-size:15px;font-weight:600;color:var(--ink)}
.tbtn[disabled]{opacity:.4;pointer-events:none}
.tbtn.nl{background:var(--teal-l);color:var(--teal-d)}
.nlform{display:flex;flex-direction:column;gap:8px;background:var(--sky);border-radius:14px;padding:10px 12px;font-size:14px}
.nlform .presets,.nlform .custom{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.nlform .presets .tbtn{min-height:38px;font-size:14px}
.nlform label{display:flex;align-items:center;gap:4px;font-weight:600}
.nlform input{width:64px;font:600 16px "Lexend",sans-serif;border:2px solid var(--line);border-radius:10px;padding:6px 8px;background:#fff;color:var(--ink)}
.padwrap{position:relative;height:clamp(340px,56vh,580px);border-radius:16px;overflow:hidden;background-color:#fff;border:2px solid var(--line)}
.padwrap.grid{background-image:linear-gradient(#e6edf1 1px,transparent 1px),linear-gradient(90deg,#e6edf1 1px,transparent 1px);background-size:26px 26px}
.padwrap canvas{position:absolute;inset:0;width:100%;height:100%}
#ink{touch-action:none;cursor:crosshair}
.padhint{position:absolute;left:12px;bottom:10px;right:12px;font-size:14px;color:var(--muted);pointer-events:none}
.qtop .padtoggle{margin-left:auto}
.qtop .padtoggle+.iconbtn{margin-left:0}
.modeseg{display:inline-flex;gap:4px;padding:4px;border-radius:14px;background:#f4ede1;align-self:flex-start}
.modeseg button{min-height:44px;padding:0 16px;border-radius:11px;border:0;background:transparent;font-weight:600;font-size:16px;display:inline-flex;align-items:center;gap:6px}
.modeseg button.on{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.1);color:var(--teal-d)}
.paper{position:relative;border-radius:16px;overflow:hidden;border:2px solid var(--line);background:#fffdf7}
.paper canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.selfchk{display:grid;gap:8px}
.selfchk button{text-align:left;min-height:48px;border-radius:12px;border:2px solid var(--line);background:#fff;padding:8px 12px 8px 44px;font-size:16px;position:relative}
.selfchk button::before{content:"";position:absolute;left:12px;top:50%;width:20px;height:20px;margin-top:-10px;border-radius:6px;border:2px solid var(--line2)}
.selfchk button.on{background:var(--mint-l);border-color:#8fdcbb}
.selfchk button.on::before{background:var(--mint);border-color:var(--mint)}
.readback{background:var(--sky);border-radius:12px;padding:8px 12px;white-space:pre-wrap}
.xbtns{display:flex;gap:8px;flex-wrap:wrap}
.xbtns .btn{position:relative}
.badge{position:absolute;top:-8px;right:-8px;min-width:22px;height:22px;border-radius:999px;background:#ff3b5c;color:#fff;font:700 13px/22px system-ui,sans-serif;padding:0 6px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.xpage{display:flex;flex-direction:column;gap:16px}
.xhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;color:var(--x-head)}
.xhead h1{font-family:var(--disp);font-size:32px;font-weight:700}
.xintro{margin:0;color:var(--x-head);opacity:.9}
.dress-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:18px;align-items:start}
@media (max-width:860px){.dress-grid{grid-template-columns:1fr}}
.stagebox{padding:0;overflow:hidden;display:flex;flex-direction:column;gap:12px;padding-bottom:14px;position:sticky;top:calc(10px + env(safe-area-inset-top,0px))}
@media (max-width:860px){.stagebox{position:static}}
.stage{position:relative;height:300px;overflow:hidden}
.stage>svg{position:absolute;inset:0;width:100%;height:100%}
.stagepet{position:absolute;left:50%;bottom:14px;transform:translateX(-50%)}
.petpick{display:flex;gap:8px;overflow-x:auto;padding:0 14px 4px}
.petpick button{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid var(--x-line);background:var(--x-tile);color:var(--x-text);border-radius:16px;padding:6px 8px;font-size:13px;font-weight:600;min-width:78px}
.petpick button.on{border-color:var(--x-accent);box-shadow:0 0 0 3px var(--x-accent-soft)}
.shopbox{padding:16px;display:flex;flex-direction:column;gap:12px}
.dtabs{display:flex;gap:6px;flex-wrap:wrap}
.dtabs button{position:relative;min-height:42px;padding:0 14px;border-radius:999px;border:2px solid var(--x-line);background:var(--x-tile);color:var(--x-text);font-weight:600;font-size:15px}
.dtabs button.on{background:var(--x-accent);border-color:var(--x-accent);color:var(--x-on-accent)}
.dtabs .dot{position:absolute;top:-2px;right:-2px;width:11px;height:11px;border-radius:50%;background:#ff3b5c;border:2px solid var(--x-tile)}
.shophint{margin:0;font-size:15px;color:var(--x-muted)}
.items2{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:10px}
.tile2{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid var(--x-line);background:var(--x-tile);color:var(--x-text);border-radius:18px;padding:10px 8px;min-height:150px;text-align:center}
.tile2.on{border-color:var(--x-accent);box-shadow:0 0 0 3px var(--x-accent-soft)}
.tile2.locked .tprev{filter:grayscale(1) opacity(.45)}
.tile2 .tprev{height:86px;display:grid;place-items:center}
.tname{font-weight:700;font-size:15px}
.tstate{font-size:12px;font-weight:700;color:var(--x-accent)}
.tlock{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--x-muted);line-height:1.3}
.tlock .li{width:18px;height:18px}
.tbar{display:block;width:100%;height:7px;border-radius:999px;background:var(--x-bar);overflow:hidden;margin-top:3px}
.tbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#ffc53d,#ff8a4a)}
.tprog{font-size:11px;font-variant-numeric:tabular-nums}
.newtag{position:absolute;top:6px;right:6px;background:#ff3b5c;color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px}
.bgthumb{display:block;width:120px;height:74px;border-radius:12px;overflow:hidden;position:relative}
.bgthumb.sm{width:74px;height:46px}
.bgthumb>svg{position:absolute;inset:0;width:100%;height:100%}
.decicon{width:80px;height:80px;overflow:visible}
.goalsum{margin:0}
.goals2{display:grid;gap:8px}
.goal2{display:grid;grid-template-columns:84px 1fr;gap:10px;align-items:center;border:2px solid var(--x-line);border-radius:16px;padding:8px 12px;background:var(--x-tile);font-size:15px}
.goal2 .gprev{display:grid;place-items:center}
.goal2 .decicon{width:60px;height:60px}
.guide-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.gcard{display:flex;flex-direction:column;border:0;padding:0;border-radius:20px;overflow:hidden;background:var(--x-card);color:var(--x-text);box-shadow:0 10px 24px rgba(0,0,0,.25);text-align:left}
.gcard:active{transform:translateY(2px)}
.gimg{position:relative;display:block;height:130px;background:var(--x-bar)}
.gimg img{width:100%;height:100%;object-fit:cover;display:block}
.gface{position:absolute;right:4px;bottom:-18px}
.gname{font-weight:700;font-size:17px;padding:10px 12px 0}
.gmeta{display:flex;gap:4px;flex-wrap:wrap;padding:6px 12px 12px;min-height:34px}
.mini2{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--x-bar);display:inline-flex;align-items:center;gap:3px}
.mini2 .ic{width:13px;height:13px}
.mini2.have{background:var(--x-accent-soft);color:var(--x-accent)}
.mini2.gold{background:rgba(255,197,61,.25)}
.mini2.new{background:#ff3b5c;color:#fff}
.muted2{opacity:.75;font-size:.85em}
.quiz{display:flex;flex-direction:column;gap:12px}
.qn{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--x-muted)}
.qq{font-size:22px;font-weight:700;line-height:1.35}
.qc{display:grid;gap:8px}
.qc button{text-align:left;min-height:54px;border-radius:14px;border:2px solid var(--x-line);background:var(--x-tile);color:var(--x-text);font-size:18px;padding:8px 14px}
.qc button.right{background:rgba(39,184,132,.2);border-color:#27b884}
.qc button.wrong{background:rgba(255,90,110,.18);border-color:#ff5a6e}
.qfb{min-height:26px;font-size:18px}
.twk{animation:twk 2.2s ease-in-out infinite}
@keyframes twk{50%{opacity:.35}}
:root{--x-head:#fff;--x-card:var(--card);--x-tile:#fff;--x-line:var(--line);--x-text:var(--ink);--x-muted:var(--muted);--x-accent:var(--teal);--x-accent-soft:var(--teal-l);--x-on-accent:#fff;--x-bar:#efe6d6}
.realcard{background:#fff;border:2px solid var(--line);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:center;max-width:460px;margin:0 auto;position:relative}
.realtag{position:absolute;top:18px;left:18px;background:var(--gold);color:#4a3600;font-weight:700;font-size:13px;padding:3px 10px;border-radius:999px;z-index:1}
.realpic{display:block;width:100%;max-width:420px;height:auto;border-radius:14px;background:#eee}
.realpic.big{max-width:100%;max-height:46vh;object-fit:contain}
.cap{margin:0;font-size:15px;color:var(--muted);text-align:center}
.learn{max-width:640px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px;font-size:18px}
.learn-h{display:flex;align-items:center;gap:12px}
.learn-h h2{font-family:var(--disp);font-size:28px;font-weight:800}
.learn-h .iconbtn{margin-left:auto}
.facts{margin:0;padding-left:22px;display:grid;gap:6px;line-height:1.45}
.credit{margin:0;font-size:12px;color:var(--muted)}
.cove .card-h{flex-wrap:wrap}

.tier{position:absolute;top:6px;left:6px;font:700 10px/1 Lexend,sans-serif;letter-spacing:.04em;text-transform:uppercase;padding:4px 7px;border-radius:99px;color:#fff;z-index:2}
.tier.t1{background:#3f8cff}.tier.t2{background:#9b5cff}.tier.t3{background:linear-gradient(90deg,#ffb700,#ff5aa8)}
.tprice{display:inline-flex;align-items:center;gap:4px;font:700 14px Lexend,sans-serif;padding:4px 10px;border-radius:99px;background:rgba(127,127,127,.16);margin-top:4px}
.tprice.ok{background:#ffe27a;color:#3d2c2e}
.tprice svg{width:16px;height:16px}
.pkrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:0 14px 10px}
.pkrow .pk{border:2px solid rgba(127,127,127,.3);background:transparent;color:inherit;border-radius:99px;padding:7px 13px;font:600 14px Lexend,sans-serif;cursor:pointer}
.pkrow .pk.on{background:var(--pk,#8f6bff);border-color:var(--pk,#8f6bff);color:#fff}
.wallet{display:inline-flex;align-items:center;gap:5px;font:800 15px Lexend,sans-serif;margin-right:6px;padding:6px 12px;border-radius:99px;background:#ffe27a;color:#3d2c2e}
.wallet svg{width:18px;height:18px}
@keyframes spinme{to{transform:rotate(360deg)}}.spinme{animation:spinme 1.6s linear infinite;transform-box:fill-box;transform-origin:center}

@media (max-width:640px){.toast{bottom:auto;top:calc(10px + env(safe-area-inset-top,0px))}}
.iconbtn.sm{width:44px;height:44px;min-width:44px;flex:none;border-radius:13px}

}

.dtabs button{min-height:44px}
.linkbtn{min-height:44px}

.tier{font:700 11px/1 Lexend,sans-serif;padding:4px 8px}

/* R2-CSS-BEGIN */
/* ---- round 2: calm Fact Sprint, Comeback Cards, Book Club ---- */
.vh{position:absolute!important;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
.sp-path{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;padding:16px 4px 4px;max-width:560px;margin:0 auto}
.sp-path i{position:relative;width:24px;height:24px;border-radius:50%;background:#efe6d6;box-shadow:inset 0 2px 3px rgba(0,0,0,.1);transition:background .25s,transform .25s}
.sp-path i.on{background:linear-gradient(180deg,#34cf96,#23a877);transform:scale(1.08);box-shadow:0 2px 0 var(--mint-d)}
.sp-path i.best{outline:3px solid var(--gold);outline-offset:2px}
.sp-path i b{position:absolute;left:50%;top:-20px;transform:translateX(-50%);line-height:0}
.sp-path i b .ic{width:17px;height:17px}
.sp-legend{font-size:15px;color:var(--muted);text-align:center;margin:0}
.rv-intro .rv-cards{display:flex;justify-content:center;height:84px;align-items:flex-end}
.rv-card{width:56px;height:76px;border-radius:13px;background:linear-gradient(160deg,#fff,var(--gold-l));border:3px solid #3d2c2e;box-shadow:0 6px 12px rgba(0,0,0,.14);display:grid;place-items:center;margin:0 -5px;transform:rotate(var(--r));animation:rvin .5s ease-out backwards}
.rv-card:nth-child(2){animation-delay:.08s}.rv-card:nth-child(3){animation-delay:.16s}.rv-card:nth-child(4){animation-delay:.24s}.rv-card:nth-child(5){animation-delay:.32s}
@keyframes rvin{from{transform:translateY(30px) rotate(0);opacity:0}}
.rv-say{margin:0;font-size:20px;max-width:32em;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
/* book club */

function drawStroke(ctx,s,from){const p=s.pts;ctx.save();ctx.globalCompositeOperation=s.er?'destination-out':'source-over';ctx.strokeStyle=s.c;ctx.fillStyle=s.c;ctx.lineWidth=s.w;ctx.lineCap='round';ctx.lineJoin='round';

const nlX=(L,i,W)=>36+i/L.n*(W-72);
function nlLabel(L,i){if(L.d)return i===0?'0':i===L.d?'1':`${i}/${L.d}`;return fmtN(L.from+i*L.step)}
function drawLines(){const c=$('#nlc');if(!c)return;const ctx=c.getContext('2d'),W=c.clientWidth;ctx.clearRect(0,0,c.width,c.height);
 PAD.lines.forEach(L=>{const y=L.y;ctx.strokeStyle='#132530';ctx.fillStyle='#132530';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(16,y);ctx.lineTo(W-16,y);ctx.stroke();
  [[16,1],[W-16,-1]].forEach(([x,dir])=>{ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+dir*10,y-6);ctx.lineTo(x+dir*10,y+6);ctx.closePath();ctx.fill()});
  const k=Math.max(1,Math.ceil((L.n+1)/(W<500?8:13)));ctx.font='600 14px Lexend, system-ui, sans-serif';ctx.textAlign='center';
  for(let i=0;i<=L.n;i++){const x=nlX(L,i,W),major=i%k===0||i===L.n;ctx.lineWidth=major?3:2;ctx.beginPath();ctx.moveTo(x,y-(major?11:7));ctx.lineTo(x,y+(major?11:7));ctx.stroke();if(major)ctx.fillText(nlLabel(L,i),x,y+30)}
  L.jumps.forEach(j=>{const xa=nlX(L,j.a,W),xb=nlX(L,j.b,W),mid=(xa+xb)/2,h=Math.min(46,Math.abs(xb-xa)*.4+14);ctx.strokeStyle='#e8483a';ctx.fillStyle='#e8483a';ctx.lineWidth=2.6;ctx.beginPath();ctx.moveTo(xa,y-8);ctx.quadraticCurveTo(mid,y-8-2*h,xb,y-8);ctx.stroke();
   const dir=xb>xa?1:-1;ctx.beginPath();ctx.moveTo(xb,y-7);ctx.lineTo(xb-dir*9,y-15);ctx.lineTo(xb-dir*2,y-18);ctx.closePath();ctx.fill();
   const diff=j.b-j.a,sign=diff>0?'+':'−',lab=L.d?`${sign}${Math.abs(diff)}/${L.d}`:`${sign}${fmtN(Math.abs(diff)*L.step)}`;ctx.font='700 15px Lexend, system-ui, sans-serif';ctx.fillText(lab,mid,y-12-h)});
  if(PAD.sel&&PAD.sel.L===L){ctx.fillStyle='#ffc53d';ctx.strokeStyle='#132530';ctx.lineWidth=2;ctx.beginPath();ctx.arc(nlX(L,PAD.sel.i,W),y,9,0,6.283);ctx.fill();ctx.stroke()}})}

 if(d)L={from:0,to:1,step:1/d,d,n:d};else{const n=(to-from)/step;if(!(step>0)||!(to>from)||!isFinite(n)){toast('Check your numbers: “To” must be bigger than “From.”');return}if(Math.abs(n-Math.round(n))>1e-6){toast('Counting by '+fmtN(step)+' doesn’t land on '+fmtN(to)+'. Try another number.');return}if(n>50){toast('That’s too many marks. Count by a bigger number.');return}L={from,to,step,n:Math.round(n)}}

 otter:{sp:'River Otter',cap:'A real river otter at a wildlife refuge.',intro:['River otters have thick fur that keeps them warm and dry in the water.','They can close their ears and nose when they dive.','They eat fish, crabs and crayfish.','Otters love to slide and play!'],credit:'Photo: U.S. Fish and Wildlife Service, public domain, Wikimedia Commons',quiz:[['What can otters close when they dive?','Their ears and nose','Their tails','Their feet'],['What do river otters eat?','Fish, crabs and crayfish','Leaves and bark','Seeds'],['What do otters love to do?','Slide and play','Sleep all year','Build nests in trees']]},
 owl:{sp:'Burrowing Owl',cap:'A real burrowing owl standing on a post.',intro:['Burrowing owls live in holes in the ground instead of in trees.','They are awake during the day, not just at night.','They are small, only about 9 inches tall.','They bob their heads up and down when they are curious.'],credit:'Photo: Charles J. Sharp, CC BY-SA 4.0, Wikimedia Commons',quiz:[['Where do burrowing owls live?','In holes in the ground','At the top of tall trees','In the ocean'],['When are burrowing owls awake?','During the day too','Never during the day','Only in winter'],['What do they do when they’re curious?','Bob their heads','Sing a song','Change color']]},
 panther:{sp:'Florida Panther',cap:'A real Florida panther in Everglades National Park.',intro:['The Florida panther is Florida’s official state animal.','It is a kind of cougar, also called a puma or mountain lion.','Florida panthers are endangered. Only about 120 to 230 adults live in the wild.','They mostly hunt deer and wild hogs.'],credit:'Photo: Rodney Cammauf, National Park Service, public domain, Wikimedia Commons',quiz:[['What is special about the Florida panther?','It’s Florida’s state animal','It can fly','It lives only in the ocean'],['What kind of cat is it?','A kind of cougar','A house cat','A tiger'],['What does endangered mean for panthers?','Very few are left','There are millions','They are all in zoos']]},
 deer:{sp:'Key Deer',cap:'A real Key deer on Big Pine Key, Florida.',intro:['Key deer live only in the Florida Keys.','They are the smallest deer in North America, about as tall as a big dog.','They can swim from island to island.','They are endangered, so drivers go slowly where they live.'],credit:'Photo: Joseph C. Boone, CC BY-SA 3.0, Wikimedia Commons',quiz:[['Where do Key deer live?','Only in the Florida Keys','All over the world','In Canada'],['How big are Key deer?','About as tall as a big dog','Taller than a giraffe','As small as a mouse'],['How do Key deer get between islands?','They swim','They fly','They ride boats']]},
 bear:{sp:'Florida Black Bear',cap:'A real Florida black bear, photographed by a wildlife camera set up by Florida biologists.',intro:['The Florida black bear is Florida’s biggest land mammal.','Even though they are bears, they eat mostly plants, like berries, nuts and acorns.','They have an amazing sense of smell.','Locking up trash keeps bears safe and wild.'],credit:'Photo: Florida Fish and Wildlife Conservation Commission, public domain, Wikimedia Commons',quiz:[['What do Florida black bears eat the most?','Plants, like berries and nuts','Only fish','Rocks'],['What sense is super strong in bears?','Smell','Taste','Nothing special'],['How can people help keep bears wild?','Lock up their trash','Feed them cookies','Leave food outside']]},
 turtle:{sp:'Loggerhead Sea Turtle',cap:'A real loggerhead sea turtle swimming overhead.',intro:['Loggerheads are named for their big, heavy heads and strong jaws.','They crunch crabs, clams and snails.','Mother turtles crawl onto Florida beaches at night to lay about 100 eggs.','Bright beach lights confuse baby turtles, so beach towns turn lights down at night.'],credit:'Photo: ukanda, CC BY 2.0, Wikimedia Commons',quiz:[['Why are they called loggerheads?','They have big, heavy heads','They live in logs','They eat logs'],['About how many eggs does a mother lay?','About 100','Just 1','A million'],['Why do beach towns turn lights down at night?','So baby turtles find the ocean','To save candy','So fish can sleep']]},
 gator:{sp:'American Alligator',cap:'A real American alligator resting on the ground.',intro:['The American alligator is Florida’s official state reptile.','Alligators have a wide, U-shaped snout. Crocodiles have a pointier, V-shaped snout.','Their eyes and nostrils are on top of their head, so they can hide in water and still see and breathe.','Baby alligators chirp to call their mom.'],credit:'Photo: Postdlf, CC BY-SA 3.0, Wikimedia Commons',quiz:[['What shape is an alligator’s snout?','Wide, like a U','Pointy, like a V','Square'],['Why are their eyes on top of their head?','To see while hiding in water','To look at the stars','So they can sleep'],['How do baby alligators call their mom?','They chirp','They bark','They clap']]},
 flamingo:{sp:'American Flamingo',cap:'A real American flamingo spotted at Clearwater Beach, Florida.',intro:['Flamingos get their pink color from the shrimp and algae they eat.','They often stand on one leg.','They eat with their heads upside down, filtering food out of the water with their beaks.','Wild flamingos are sometimes seen in Florida Bay and the Everglades.'],credit:'Photo: JeffreyGammon, CC BY 4.0, Wikimedia Commons',quiz:[['What makes flamingos pink?','The shrimp and algae they eat','Pink paint','The sun'],['How do flamingos often stand?','On one leg','On their heads','On three legs'],['How do flamingos eat?','With their heads upside down','With a spoon','Only at night in trees']]},
 dolphin:{sp:'Bottlenose Dolphin',cap:'A real bottlenose dolphin surfing the wave behind a boat.',intro:['Bottlenose dolphins are mammals, so they breathe air through a blowhole on top of their heads.','Each dolphin has its own signature whistle, a bit like a name.','They live in groups called pods.','They find food with echolocation: they send out clicks and listen for the echoes.'],credit:'Photo: NASA, public domain, Wikimedia Commons',quiz:[['How do dolphins breathe?','Air through a blowhole','Water through gills','They don’t breathe'],['What is a group of dolphins called?','A pod','A flock','A herd of cows'],['How do dolphins find food?','Echolocation: clicks and echoes','They smell it from space','They ask a crab']]}};

function wearSVG(w,sp){let b='',f='';if(!w)return{b,f};['neck','face','hat','hold'].forEach(slot=>{const id=w[slot];if(!id)return;const [base,col]=id.split('-');const fn=ACCART[base];if(fn){const r=col?fn(sp,COLS[col]):fn(sp);b+=r.b||'';f+=r.f||''}});return{b,f}}

/* ---------- unlocks, challenges ---------- */
const SLOTNAME={hat:'hat',face:'face item',neck:'neckwear',hold:'held item',bg:'scene',decor:'decoration'};
const WEAR_SLOTS=['hat','face','neck','hold'];
function allItems(){const out=[];for(const k in CFG.items)CFG.items[k].forEach(it=>out.push({...it,slot:k}));return out}
const isOwned=it=>it.free||(it.cost?(S.bought||[]).includes(it.id):CFG.stat(it.need[0])>=it.need[1]);
const TIER=['','Rare','Epic','Legendary'];
const wallet=()=>S[CFG.curName]||0;
let DUPK='All';const packsOf=slot=>{const p=[];CFG.items[slot].forEach(it=>{const k=it.p||'Classic';if(!p.includes(k))p.push(k)});return p};
function checkUnlocks(silent){if(!S)return[];S.owned=S.owned||[];const newly=[];allItems().forEach(it=>{if(!it.cost&&isOwned(it)&&!S.owned.includes(it.id)){S.owned.push(it.id);if(!it.free&&!silent)newly.push(it)}});
 if(newly.length){S.newItems=(S.newItems||[]).concat(newly.map(i=>i.id));newly.forEach((it,i)=>setTimeout(()=>{toast(`Unlocked a new ${SLOTNAME[it.slot]}: <b>${esc(it.name)}</b>! Check Dress Up.`);tone([523,784,1047],.08,'triangle')},1200+i*3000))}return newly}
function bump(k,n=1){S.stats=S.stats||{};S.stats[k]=(S.stats[k]||0)+n}
const wearOf=key=>(S.outfit&&S.outfit[key])||{};
function petArt(p,size,cls=''){return CFG.art(p.id,size,cls,wearOf(p.key))}
const newIn=slot=>(S.newItems||[]).filter(id=>{const it=allItems().find(x=>x.id===id);return it&&(slot?it.slot===slot:true)}).length;
function exploreButtons(){const n=newIn();return`<div class="xbtns"><button class="btn ghost sm" data-act="guide">${CFG.guideIcon} ${CFG.guideName}</button><button class="btn sm ${CFG.dressBtnCls}" data-act="dress">${ICON.star} Dress Up${n?`<span class="badge">${n}</span>`:''}</button></div>`}

/* ---------- dress up ---------- */
let DU={pet:0,tab:'hat'};
function tileHTML(it,pet){const owned=isOwned(it),slot=DU.tab,isNew=(S.newItems||[]).includes(it.id);let on=false,prev='';
 if(WEAR_SLOTS.includes(slot)){on=pet&&wearOf(pet.key)[slot]===it.id;const p=pet||CFG.samplePet;prev=CFG.art(p.id,'md','',{[slot]:it.id})}
 else if(slot==='bg'){on=(S.scene&&S.scene.bg)===it.id;prev=`<div class="bgthumb">${CFG.sceneSVG(it.id,[])}</div>`}
 else{on=(S.scene&&S.scene.decor||[]).includes(it.id);prev=`<svg class="decicon" viewBox="-70 -130 140 140" aria-hidden="true">${CFG.decorArt(it.id)}</svg>`}
 const v=it.free||it.cost?0:Math.min(CFG.stat(it.need[0]),it.need[1]),tg=it.t?`<span class="tier t${it.t}">${TIER[it.t]}</span>`:'';
 return`<button class="tile2 ${owned?'':it.cost?'shop':'locked'} ${on?'on':''}" data-act="du-item" data-id="${it.id}" aria-pressed="${on}" aria-label="${esc(it.name)}${owned?'':it.cost?` (costs ${it.cost} ${CFG.curName})`:' (locked)'}">${isNew?'<span class="newtag">New!</span>':tg}<span class="tprev">${prev}</span><span class="tname">${esc(it.name)}</span>${owned?(on?'<span class="tstate">Wearing</span>'.replace('Wearing',WEAR_SLOTS.includes(slot)?'Wearing':'On'):''):(it.cost?`<span class="tprice ${wallet()>=it.cost?'ok':''}">${ICON.heart} ${it.cost.toLocaleString('en-US')}</span>`:`<span class="tlock">${LOCK}<span>${esc(it.need[2])}</span><span class="tbar"><i style="width:${v/it.need[1]*100}%"></i></span><span class="tprog">${v} / ${it.need[1]}</span></span>`)}</button>`}
const LOCK=`<svg viewBox="0 0 24 24" class="li" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2.5" fill="currentColor"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="2.4" fill="none"/></svg>`;
const DTABS=[['hat','Hats'],['face','Glasses'],['neck','Neckwear'],['hold','Hold'],['bg','Scenes'],['decor','Decorations'],['goals','Challenges']];
function goalsHTML(){const items=allItems(),owned=items.filter(isOwned).length;const locked=items.filter(it=>!isOwned(it)&&!it.cost).map(it=>({it,r:Math.min(1,CFG.stat(it.need[0])/it.need[1])})).sort((a,b)=>b.r-a.r);
 return`<p class="goalsum">${SAYBTN('say-dress')}<span>You’ve earned <b>${owned}</b> of <b>${items.length}</b> items. Keep going to unlock the rest!</span></p><div class="goals2">${locked.map(({it,r})=>`<div class="goal2"><span class="gprev">${WEAR_SLOTS.includes(it.slot)?CFG.art((CFG.pets()[DU.pet]||CFG.samplePet).id,'sm','',{[it.slot]:it.id}):it.slot==='bg'?`<span class="bgthumb sm">${CFG.sceneSVG(it.id,[])}</span>`:`<svg class="decicon" viewBox="-70 -130 140 140">${CFG.decorArt(it.id)}</svg>`}</span><span class="gtext"><b>${esc(it.name)}</b> <span class="muted">${SLOTNAME[it.slot]}</span><br>${esc(it.need[2])}<span class="tbar"><i style="width:${r*100}%"></i></span><span class="tprog">${Math.min(CFG.stat(it.need[0]),it.need[1])} / ${it.need[1]}</span></span></div>`).join('')||'<p>You unlocked everything. Amazing!</p>'}</div>`}
function renderDress(){screen='dress';hush();const pets=CFG.pets();if(DU.pet>=pets.length)DU.pet=0;const pet=pets[DU.pet]||null;const y=scrollY;
 app.innerHTML=`${topbar()}<div class="xpage"><div class="xhead"><button class="btn ghost sm" data-act="go-home">${ICON.back} Home</button><h1>Dress Up</h1></div>
 <div class="dress-grid"><section class="box stagebox ${['bg','decor'].includes(DU.tab)?'tabscene':'tabwear'}"><div class="stage">${CFG.sceneSVG(S.scene.bg,S.scene.decor)}<div class="stagepet">${pet?petArt(pet,'xl','bob'):''}</div></div>${stripHTML()}
  ${pets.length?`<div class="petpick">${pets.map((p,i)=>`<button class="${i===DU.pet?'on':''}" data-act="du-pet" data-i="${i}">${petArt(p,'sm')}<span>${esc(p.name)}</span></button>`).join('')}</div>${pet&&Object.values(wearOf(pet.key)).some(Boolean)?`<button class="linkbtn" data-act="du-clear">Take everything off ${esc(pet.name)}</button>`:''}`:`<p class="muted" style="padding:0 14px">${CFG.noPets}</p>`}</section>
 <section class="box shopbox"><div class="dtabs" role="tablist">${DTABS.map(([k,l])=>`<button role="tab" aria-selected="${DU.tab===k}" class="${DU.tab===k?'on':''}" data-act="du-tab" data-t="${k}">${l}${k!=='goals'&&newIn(k)?'<i class="dot"></i>':''}</button>`).join('')}</div>
  ${DU.tab==='goals'?goalsHTML():`<p class="shophint">${SAYBTN('say-dress')}<span>${WEAR_SLOTS.includes(DU.tab)?(pet?`Tap to put it on ${esc(pet.name)}. Tap again to take it off.`:'Pick a friend first.'):DU.tab==='bg'?'Pick the scene for your '+CFG.placeName+'.':'Pick up to 3 decorations for your '+CFG.placeName+'.'} Locked items show how to earn them, and shop items cost ${CFG.curName}.</span></p><div class="pkrow"><span class="wallet">${ICON.heart} ${wallet().toLocaleString('en-US')}</span>${['All',...packsOf(DU.tab)].map(p=>`<button class="pk ${DUPK===p?'on':''}" data-act="du-pk" data-p="${esc(p)}">${esc(p)}</button>`).join('')}</div><div class="items2">${CFG.items[DU.tab].filter(it=>DUPK==='All'||(it.p||'Classic')===DUPK).map(it=>tileHTML(it,pet)).join('')||'<p class="muted">Nothing in this pack for this tab yet.</p>'}</div>`}</section></div></div>`;
 S.newItems=(S.newItems||[]).filter(id=>{const it=allItems().find(x=>x.id===id);return it&&it.slot!==DU.tab});wireGate();scrollTo(0,y)}
Object.assign(ACT,{
 dress(){DU.tab=DU.tab||'hat';renderDress()},
 'du-tab'(b){DU.tab=b.dataset.t;if(DU.tab!=='goals'&&DUPK!=='All'&&!packsOf(DU.tab).includes(DUPK))DUPK='All';renderDress()},
 'du-pk'(b){DUPK=b.dataset.p;sfx.tap();renderDress()},
 'du-pet'(b){DU.pet=+b.dataset.i;sfx.tap();renderDress()},
 'du-clear'(){const p=CFG.pets()[DU.pet];if(p){S.outfit[p.key]={};save();renderDress()}},
 'du-item'(b){const it=allItems().find(x=>x.id===b.dataset.id);if(!it)return;if(!isOwned(it)){if(it.cost){if(wallet()<it.cost){const need=it.cost-wallet();say(`The ${it.name} costs ${it.cost} ${CFG.curName}. You need ${need} more. Keep practicing!`);toast(`You need <b>${need.toLocaleString('en-US')}</b> more ${CFG.curName} for the ${esc(it.name)}.`);return}
   confirmBox(`Buy the <b>${esc(it.name)}</b> for <b>${it.cost.toLocaleString('en-US')}</b> ${CFG.curName}?<br><span class="muted">You have ${wallet().toLocaleString('en-US')}.</span>`,'Buy it!',()=>{S[CFG.curName]-=it.cost;S.bought=S.bought||[];S.bought.push(it.id);S.owned=S.owned||[];S.owned.push(it.id);tone([523,659,784,1047],.08,'triangle');toast(`You got the <b>${esc(it.name)}</b>!`);save();renderDress()},'Not now');return}
   say(`To unlock the ${it.name}: ${it.need[2]}`);toast(`${LOCK_TXT} ${esc(it.need[2])}`);return}
  const pets=CFG.pets(),pet=pets[DU.pet];S.scene=S.scene||{bg:CFG.items.bg[0].id,decor:[]};

 for(const sent of String(text).split(/(?<=[.!?:;])\s+|["“”]/)){const ws=sent.match(/[A-Za-z][A-Za-z’'-]*|\d+/g)||[];

 'bc-color'(b){const d=BC.draft;if(!d)return;d.color=b.dataset.c;$$('.swatch').forEach(x=>{const on=x.dataset.c===d.color;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on)});$('#bcPrev').innerHTML=coverSVG({title:d.title.trim()||'My book',author:d.author.trim(),color:d.color},150);sfx.tap()},
 'bc-save-book'(){const d=BC.draft;if(!d)return;const title=(($('#bTitle')||{}).value||d.title).trim();if(!title){toast('Type the book’s title first!');$('#bTitle').focus();return}
  const ch=parseInt((($('#bCh')||{}).value||d.chapters||'').replace(/\D/g,''),10);const bk={id:'b'+Date.now().toString(36)+rnd(10,99),title:title.slice(0,80),author:(($('#bAuthor')||{}).value||d.author).trim().slice(0,60),chapters:ch>0&&ch<=300?ch:null,color:d.color,started:today(),done:null,rating:null,fav:null,log:[]};
  S.books=S.books||[];S.books.push(bk);S.bookCur=bk.id;save();sfx.good();BC.id=bk.id;BC.draft=null;BC.view='book';renderBook();toast('On your shelf! Now read a chapter and log it.')},
 'bc-log'(b){if(b&&b.dataset.id)BC.id=b.dataset.id;const bk=bcBook();if(!bk)return;S.bookCur=bk.id;BC.draft=null;BC.think=null;BC.make=null;BC.ent=null;BC.view='log';renderBook()},
 'bc-ch'(b){const d=BC.draft;if(!d||d.fb)return;d.ch=Math.max(1,Math.min(300,d.ch+(+b.dataset.d)));$('.bc-chn').textContent=d.ch;sfx.tap()},
 'bc-mode'(b){const d=BC.draft;if(!d||d.busy||d.fb)return;d.mode=b.dataset.m;renderBook(true)},
 'bc-starter'(b){const d=BC.draft;if(!d)return;if(d.mode==='hand'&&(S.hand||'sometimes')!=='off'){say(b.dataset.t);toast('Try: '+esc(b.dataset.t));return}const ta=$('#bcText');if(!ta)return;const v=ta.value,s=b.dataset.t,pre=v&&!/\s$/.test(v)?' ':'';ta.value=v+pre+s+' ';d.text=ta.value;bcLogMeta();ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length)},
 'bc-hw-pen'(b){const d=BC.draft;if(!d||!d.hw)return;d.hw.tool='pen';d.hw.pen=b.dataset.c;renderBook(true)},'bc-hw-eraser'(){const d=BC.draft;if(!d||!d.hw)return;d.hw.tool='eraser';renderBook(true)},
 'bc-hw-undo'(){if(QW&&QW.hs){QW.hs.pop();hwRedraw()}},'bc-hw-clear'(){if(QW&&QW.hs){QW.hs=[];hwRedraw()}},
 'bc-hw-more'(){const d=BC.draft;if(!d||!d.hw)return;d.hw.hh+=HW_GAP*3;$('#paper').style.height=d.hw.hh+'px';hwInit()},
 'bc-read'(){const d=BC.draft;say((d&&d.text.trim())||'There is nothing written yet.')},
 'bc-send'(){bcSend()},
 'bc-selfchk'(b){const d=BC.draft;if(!d||!d.fb||!d.fb.self)return;const i=+b.dataset.i;d.fb.checks[i]=!d.fb.checks[i];b.classList.toggle('on',d.fb.checks[i]);b.setAttribute('aria-pressed',d.fb.checks[i]);sfx.tap()},
 'bc-to-think'(){const d=BC.draft;if(!d||d.ent===null)return;BC.ent=d.ent;BC.draft=null;BC.think=null;BC.view='think';renderBook()},
 'bc-think'(b){BC.ent=+b.dataset.i;BC.think=null;BC.view='think';renderBook()},
 'bc-photo-x'(){if(BC.think){BC.think.photo=null;BC.think.thumb=null}renderBook(true)},
 'bc-ask'(){bcAsk()},'bc-share'(){bcShare()},
 'bc-to-make'(){BC.think=null;BC.make=null;BC.view='make';renderBook()},
 'bc-make'(b){BC.ent=+b.dataset.i;BC.make=null;BC.view='make';renderBook()},
 'bc-make-kind'(b){BC.make=b.dataset.k==='draw'?{kind:'draw',strokes:[],color:DR_COLORS[0][0],size:DR_SIZES[1][0],tool:'pen',penSeen:false}:{kind:'story',text:'',fb:null};renderBook()},
 'bc-make-back'(){BC.make=null;renderBook()},'bc-make-skip'(){BC.make=null;BC.view='book';renderBook()},
 'dr-color'(b){const M=BC.make;M.tool='pen';M.color=b.dataset.c;renderBook(true)},'dr-size'(b){const M=BC.make;M.size=+b.dataset.s;renderBook(true)},'dr-eraser'(){BC.make.tool='eraser';renderBook(true)},
 'dr-undo'(){if(BC.make){BC.make.strokes.pop();drRedraw()}},'dr-clear'(){if(BC.make&&BC.make.strokes.length)confirmBox('Clear your whole drawing?','Clear it',()=>{BC.make.strokes=[];drRedraw();const h=$('#drhint');if(h)h.hidden=false},'Keep it')},
 'dr-save'(){drSave()},
 'st-starter'(b){const ta=$('#bcStory');if(!ta)return;const v=ta.value,s=b.dataset.t,pre=v&&!/\s$/.test(v)?' ':'';ta.value=v+pre+s+' ';BC.make.text=ta.value;ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length)},
 'st-coach'(){stCoach()},'st-save'(){stSave()},
 'bc-finish'(){BC.draft=null;BC.view='finish';renderBook()},
 'bc-rate'(b){const d=BC.draft;if(!d)return;d.rating=+b.dataset.r;$$('.rstar').forEach(x=>{const r=+x.dataset.r;x.classList.toggle('on',r<=d.rating);x.setAttribute('aria-pressed',r===d.rating)});sfx.tap()},
 'bc-finish-go'(){const b=bcBook(),d=BC.draft;if(!b||!d)return;if(!d.rating){toast('Tap the stars to rate your book first!');return}b.done=today();b.rating=d.rating;b.fav=(d.fav||'').trim().slice(0,40)||null;b.loved=(d.loved||'').trim().slice(0,300)||null;if(S.bookCur===b.id)S.bookCur=null;gain(BC_REWARD.finish);save();sfx.win();burst();setTimeout(()=>burst(innerWidth*.3,innerHeight*.4),300);BC.draft=null;BC.view='cert';renderBook();toast(`Book finished! +${BC_REWARD.finish} hearts and a new badge!`);say(['You finished the whole book!',300,'Here is your certificate.'])},
 'bc-cert'(b){if(b&&b.dataset.id)BC.id=b.dataset.id;BC.view='cert';renderBook()},
 'bc-view-art'(b){bcViewArt(b.dataset.id,b.dataset.b,b.dataset.i)},'bc-view-story'(b){bcViewStory(b.dataset.b,b.dataset.i,b.dataset.j)},
 'dash-rlog'(){const t=readingLogText();const done=()=>toast('Reading log copied');try{navigator.clipboard.writeText(t).then(done,()=>showCopy(t))}catch(e){showCopy(t)}}
});

/* ---------- boot ---------- */
function render(){if(!S)return renderWelcome();if(!S.current)return renderChoose();if(S.current&&S.rescueHearts>=need())return renderRescue();renderHome()}
async function boot(){S=loadLocal();render();const c=window.claude;if(!c||!c.use)return;try{DB=await c.use('db')}catch(e){DB=null}if(!DB)return;
 try{const snap=await DB.doc('cove/state').get();if(snap.exists){const raw=snap.data();if(raw&&raw.reset){if(!S||(S.updated||0)<(raw.updated||0)){try{localStorage.removeItem(LS)}catch(e){}S=null;render()}else flush();return}const remote=migrate(JSON.parse(JSON.stringify(snap.data())));if(remote&&(!S||(remote.updated||0)>(S.updated||0))){S=remote;try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}if(['home','welcome','choose','dash'].includes(screen))render()}else if(S)flush()}else if(S)flush()}catch(e){console.warn('load failed',e&&e.code)}}
boot();
</script>
